# Parent Network Dashboard — local stack (arm64-compatible)
#
# Usage (from repo root):
#   cp infra/.env.example infra/.env
#   make up

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_AUTH_METHOD: ${PIHOLE_AUTH_METHOD:-password}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-}
      PIHOLE_TOKEN: ${PIHOLE_TOKEN:-}
      PIHOLE_QUERIES_PATH: ${PIHOLE_QUERIES_PATH:-/api/queries}
      PIHOLE_AUTH_PATH: ${PIHOLE_AUTH_PATH:-/api/auth}
      PIHOLE_POLL_INTERVAL_SECONDS: ${PIHOLE_POLL_INTERVAL_SECONDS:-60}
      PIHOLE_QUERY_LENGTH: ${PIHOLE_QUERY_LENGTH:-100}
      PIHOLE_VERIFY_TLS: ${PIHOLE_VERIFY_TLS:-false}
      UNIFI_URL: ${UNIFI_URL}
      UNIFI_AUTH_METHOD: ${UNIFI_AUTH_METHOD:-session}
      UNIFI_USERNAME: ${UNIFI_USERNAME:-}
      UNIFI_PASSWORD: ${UNIFI_PASSWORD:-}
      UNIFI_TOKEN: ${UNIFI_TOKEN:-}
      UNIFI_SITE: ${UNIFI_SITE:-default}
      UNIFI_LOGIN_PATH: ${UNIFI_LOGIN_PATH:-/api/login}
      UNIFI_CLIENTS_PATH: ${UNIFI_CLIENTS_PATH:-/api/s/{site}/stat/sta}
      UNIFI_DEVICES_PATH: ${UNIFI_DEVICES_PATH:-/api/s/{site}/stat/device}
      UNIFI_NETWORKS_PATH: ${UNIFI_NETWORKS_PATH:-/api/s/{site}/rest/networkconf}
      UNIFI_EVENTS_PATH: ${UNIFI_EVENTS_PATH:-/api/s/{site}/stat/event}
      UNIFI_POLL_INTERVAL_SECONDS: ${UNIFI_POLL_INTERVAL_SECONDS:-60}
      UNIFI_EVENTS_LIMIT: ${UNIFI_EVENTS_LIMIT:-100}
      UNIFI_VERIFY_TLS: ${UNIFI_VERIFY_TLS:-false}
      UNIFI_SYSLOG_ENABLED: ${UNIFI_SYSLOG_ENABLED:-true}
      UNIFI_SYSLOG_HOST: ${UNIFI_SYSLOG_HOST:-0.0.0.0}
      UNIFI_SYSLOG_PORT: ${UNIFI_SYSLOG_PORT:-5514}
      UNIFI_SYSLOG_PROTOCOLS: ${UNIFI_SYSLOG_PROTOCOLS:-udp,tcp}
      UNIFI_SYSLOG_STALE_SECONDS: ${UNIFI_SYSLOG_STALE_SECONDS:-300}
      UNIFI_SYSLOG_HEALTH_CHECK_SECONDS: ${UNIFI_SYSLOG_HEALTH_CHECK_SECONDS:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BUILD_ID: ${BUILD_ID:-local}
      SOURCE_HEALTH_STALE_SECONDS: ${SOURCE_HEALTH_STALE_SECONDS:-300}
      SOURCE_HEALTH_MAX_FAILURES: ${SOURCE_HEALTH_MAX_FAILURES:-3}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PIHOLE_URL: ${PIHOLE_URL}
      PIHOLE_AUTH_METHOD: ${PIHOLE_AUTH_METHOD:-password}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-}
      PIHOLE_TOKEN: ${PIHOLE_TOKEN:-}
      PIHOLE_QUERIES_PATH: ${PIHOLE_QUERIES_PATH:-/api/queries}
      PIHOLE_AUTH_PATH: ${PIHOLE_AUTH_PATH:-/api/auth}
      PIHOLE_POLL_INTERVAL_SECONDS: ${PIHOLE_POLL_INTERVAL_SECONDS:-60}
      PIHOLE_QUERY_LENGTH: ${PIHOLE_QUERY_LENGTH:-100}
      PIHOLE_VERIFY_TLS: ${PIHOLE_VERIFY_TLS:-false}
      UNIFI_URL: ${UNIFI_URL}
      UNIFI_AUTH_METHOD: ${UNIFI_AUTH_METHOD:-session}
      UNIFI_USERNAME: ${UNIFI_USERNAME:-}
      UNIFI_PASSWORD: ${UNIFI_PASSWORD:-}
      UNIFI_TOKEN: ${UNIFI_TOKEN:-}
      UNIFI_SITE: ${UNIFI_SITE:-default}
      UNIFI_LOGIN_PATH: ${UNIFI_LOGIN_PATH:-/api/login}
      UNIFI_CLIENTS_PATH: ${UNIFI_CLIENTS_PATH:-/api/s/{site}/stat/sta}
      UNIFI_DEVICES_PATH: ${UNIFI_DEVICES_PATH:-/api/s/{site}/stat/device}
      UNIFI_NETWORKS_PATH: ${UNIFI_NETWORKS_PATH:-/api/s/{site}/rest/networkconf}
      UNIFI_EVENTS_PATH: ${UNIFI_EVENTS_PATH:-/api/s/{site}/stat/event}
      UNIFI_POLL_INTERVAL_SECONDS: ${UNIFI_POLL_INTERVAL_SECONDS:-60}
      UNIFI_EVENTS_LIMIT: ${UNIFI_EVENTS_LIMIT:-100}
      UNIFI_VERIFY_TLS: ${UNIFI_VERIFY_TLS:-false}
      UNIFI_SYSLOG_ENABLED: ${UNIFI_SYSLOG_ENABLED:-true}
      UNIFI_SYSLOG_HOST: ${UNIFI_SYSLOG_HOST:-0.0.0.0}
      UNIFI_SYSLOG_PORT: ${UNIFI_SYSLOG_PORT:-5514}
      UNIFI_SYSLOG_PROTOCOLS: ${UNIFI_SYSLOG_PROTOCOLS:-udp,tcp}
      UNIFI_SYSLOG_STALE_SECONDS: ${UNIFI_SYSLOG_STALE_SECONDS:-300}
      UNIFI_SYSLOG_HEALTH_CHECK_SECONDS: ${UNIFI_SYSLOG_HEALTH_CHECK_SECONDS:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BUILD_ID: ${BUILD_ID:-local}
      SOURCE_HEALTH_STALE_SECONDS: ${SOURCE_HEALTH_STALE_SECONDS:-300}
      SOURCE_HEALTH_MAX_FAILURES: ${SOURCE_HEALTH_MAX_FAILURES:-3}
      SKIP_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${UNIFI_SYSLOG_PORT:-5514}:5514/udp"
      - "${UNIFI_SYSLOG_PORT:-5514}:5514/tcp"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # SERVER-ONLY — used by /api/proxy route handlers; never NEXT_PUBLIC_*
      BACKEND_URL: ${BACKEND_URL:-http://api:8000}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # UI login gate (cookie session). ADMIN_TOKEN stays in the proxy only.
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-changeme}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-change-me-to-a-long-random-string}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
    name: parent-network-pgdata
