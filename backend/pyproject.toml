[project]
name = "parent-network-dashboard"
version = "0.1.0"
description = "Parent Network Dashboard API and worker"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy[asyncio]==2.0.40",
    "asyncpg==0.30.0",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "httpx==0.28.1",
    "alembic==1.15.2",
    "cryptography==44.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.5",
    "black==25.1.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
